(function() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 || 
           (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
           (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
        }
    });
    setInterval(function() {
        const start = Date.now();
        debugger;
        if (Date.now() - start > 100) {
            document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:20%;">Phát hiện hành vi soi code (DevTools)! Nội dung bị khóa.</h1>';
        }
    }, 500);
})();


async function decryptAndRender() {
    const password = document.getElementById('pass').value;
    const errorEl = document.getElementById('error');
    errorEl.innerText = "";
    if (!password) { errorEl.innerText = "Vui lòng nhập mật khẩu!"; return; }

    try {
        const raw = atob(PAYLOAD);
        const data = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) data[i] = raw.charCodeAt(i);

        const salt = data.slice(0, 16);
        const iv = data.slice(16, 28);
        const ciphertext = data.slice(28);

        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
        const key = await window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );

        const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
        const decryptedHtml = new TextDecoder().decode(decryptedBuffer);

        document.open();
        document.write(decryptedHtml);
        document.close();
    } catch (e) {
        errorEl.innerText = "Sai mật khẩu hoặc file đã bị sửa đổi!";
    }
}
</script>
